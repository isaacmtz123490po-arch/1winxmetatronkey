<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generador de Certificados</title>
<style>
:root{--bg:#f4f1ea;--panel:#fff;--text:#222;--muted:#666;--line:#d8d3c6;--accent:#1f3a5f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--panel:#222428;--text:#eee;--muted:#aaa;--line:#3a3d44}}
:root[data-theme="dark"]{--bg:#17181b;--panel:#222428;--text:#eee;--muted:#aaa;--line:#3a3d44}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,textarea,select{font:inherit;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
::placeholder{color:var(--muted);opacity:.75}
textarea{min-height:64px;resize:vertical}
.full{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:end}.row label{flex:1}
button{font:inherit;font-size:14px;padding:9px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
.actions{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.stage{padding-bottom:8px}
#fit{margin:0 auto;overflow:hidden}
#cert{transform-origin:top left;width:1000px;height:707px;background:#fffdf7;color:#222;position:relative;margin:0 auto;padding:34px;font-family:Georgia,'Times New Roman',serif;flex:none}
.frame{position:absolute;inset:18px;border:6px double var(--c);}
.frame::after{content:"";position:absolute;inset:8px;border:1px solid var(--c)}
.in{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 60px 20px}
.logo{height:70px;margin-bottom:6px;object-fit:contain}
.ent{letter-spacing:4px;text-transform:uppercase;font-size:15px;color:var(--c);font-weight:bold}
.ttl{font-size:50px;margin:14px 0 4px;color:var(--c);font-variant:small-caps;letter-spacing:2px}
.sub{font-style:italic;font-size:17px;color:#555}
.name{font-size:44px;margin:12px 0 6px;border-bottom:2px solid var(--c);padding:0 40px 4px;min-width:60%}
.desc{font-size:18px;line-height:1.5;max-width:760px;margin-top:8px;white-space:pre-line}
.sigs{margin-top:auto;width:100%;display:flex;justify-content:space-around;align-items:flex-end}
.sig{width:260px;font-size:14px}
.sig .l{border-top:1px solid #222;padding-top:5px;font-weight:bold}
.sig small{display:block;color:#555}
.seal{width:92px;height:92px;border-radius:50%;border:3px double var(--c);color:var(--c);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;letter-spacing:1px;text-align:center;padding:8px}
.qr{position:absolute;right:46px;bottom:34px;width:84px;text-align:center;font:9px system-ui,sans-serif;color:#555}.qr svg{width:84px;height:84px;display:block}
.simg{display:block;max-height:58px;max-width:220px;margin:0 auto -4px}
.sigbox{border:1px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.sigbox b{font-size:12px;color:var(--muted);font-weight:600}.sigbox div{display:flex;gap:6px;flex-wrap:wrap}
.sigbox button,.sigbox label.fb{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;flex-direction:row}
.sigbox input[type=file]{display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--panel);border-radius:12px;padding:14px;width:min(640px,100%)}
#pad{width:100%;height:auto;aspect-ratio:3/1;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;display:block}
@media print{#modal{display:none!important}}
.meta{position:absolute;bottom:26px;left:150px;right:150px;text-align:center;font-size:12px;color:#555;font-family:system-ui,sans-serif}
@media print{
 @page{size:A4 landscape;margin:0}
 body{background:#fff}.wrap>*:not(.stage){display:none!important}
 :root{padding:0}.wrap{padding:0;max-width:none}.stage{overflow:visible;padding:0}
 #fit{width:auto!important;height:auto!important;overflow:visible}
 #cert{margin:0;transform:scale(1.1)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
<h1>Generador de certificados</h1>
<div class="form">
 <label class="full">Tipo de certificado<select id="tipo"></select></label>
 <label>Entidad emisora<input id="ent" placeholder="Instituto Nacional de Capacitación"></label>
 <label>Título<input id="ttl" placeholder="Certificado"></label>
 <label>Subtítulo<input id="sub" placeholder="de aprobación y competencia"></label>
 <label>Nombre del titular<input id="name" placeholder="Nombre Apellido"></label>
 <label class="full">Texto / descripción<textarea id="desc" placeholder="Ha completado satisfactoriamente el curso de Gestión de Proyectos con una duración de 40 horas académicas."></textarea></label>
 <label>Fecha de emisión<input type="date" id="date"></label>
 <label>Vigencia hasta (opcional)<input type="date" id="exp"></label>
 <div class="row"><label>N.º de folio / licencia<input id="folio"></label><button class="alt" id="gen" type="button">Generar</button></div>
 <label>Autoridad 1 (nombre)<input id="a1" placeholder="Dra. María Gómez"></label>
 <label>Cargo 1<input id="c1" placeholder="Directora Académica"></label>
 <label>Autoridad 2 (nombre)<input id="a2" placeholder="Lic. Juan Pérez"></label>
 <label>Cargo 2<input id="c2" placeholder="Representante Legal"></label>
 <label>Texto del sello<input id="seal" placeholder="AUTORIZADO"></label>
 <label>Color principal<input type="color" id="color" value="#1f3a5f"></label>
 <div class="sigbox"><b>Firma 1</b><div><button type="button" data-draw="1">Dibujar</button><label class="fb">Subir imagen<input type="file" accept="image/*" data-up="1"></label><button type="button" data-clr="1">Quitar</button></div></div>
 <div class="sigbox"><b>Firma 2</b><div><button type="button" data-draw="2">Dibujar</button><label class="fb">Subir imagen<input type="file" accept="image/*" data-up="2"></label><button type="button" data-clr="2">Quitar</button></div></div>
 <label>Logo (imagen)<input type="file" id="logo" accept="image/*"></label>
 <label>URL del QR (opcional; vacío = este mismo certificado)<input id="ver" placeholder="https://verifica.tuinstituto.com/..."></label>
</div>
<div class="actions">
 <button id="print" type="button">Imprimir / Guardar PDF</button>
 <button class="alt" id="csv" type="button">Generar varios (lista de nombres)</button>
</div>
<div class="stage"><div id="fit"><div id="cert"><div class="frame"></div><div class="in">
 <img class="logo" id="o_logo" alt="" hidden>
 <div class="ent" id="o_ent"></div>
 <div class="ttl" id="o_ttl"></div>
 <div class="sub" id="o_sub"></div>
 <div class="sub" style="margin-top:14px">Se otorga a</div>
 <div class="name" id="o_name"></div>
 <div class="desc" id="o_desc"></div>
 <div class="sigs">
  <div class="sig"><img class="simg" id="o_s1" alt="" hidden><div class="l" id="o_a1"></div><small id="o_c1"></small></div>
  <div class="seal" id="o_seal"></div>
  <div class="sig"><img class="simg" id="o_s2" alt="" hidden><div class="l" id="o_a2"></div><small id="o_c2"></small></div>
 </div>
 <div class="meta" id="o_meta"></div>
 <div class="qr" id="o_qr"></div>
</div></div></div></div>
</div>
<div id="modal"><div class="box"><b style="font-size:14px">Dibuja la firma</b><canvas id="pad" width="900" height="300"></canvas>
<div class="actions"><button id="padok" type="button">Aceptar</button><button class="alt" id="padclr" type="button">Limpiar</button><button class="alt" id="padx" type="button">Cancelar</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const val=k=>F.includes(k)?($(k).value||$(k).placeholder):$(k).value;
const F=['ent','ttl','sub','name','desc','a1','c1','a2','c2','seal'];
let logoData='';
function fmt(d){if(!d)return'';const[y,m,dd]=d.split('-');const ms=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];return `${+dd} de ${ms[m-1]} de ${y}`}
function render(){
 F.forEach(k=>$('o_'+k).textContent=val(k));
 document.documentElement.style.setProperty('--c',$('color').value);
 $('cert').style.setProperty('--c',$('color').value);
 const parts=[];
 if($('folio').value)parts.push('Folio / Licencia N.º '+$('folio').value);
 if($('date').value)parts.push('Emitido el '+fmt($('date').value));
 if($('exp').value)parts.push('Vigente hasta el '+fmt($('exp').value));
 
 $('o_meta').textContent=parts.join('  ·  ');
 $('o_qr').innerHTML=qrHtml(state());
 save();
 [1,2].forEach(n=>{const e=$('o_s'+n);if(sig[n]){e.src=sig[n];e.hidden=false}else e.hidden=true});
 const l=$('o_logo');if(logoData){l.src=logoData;l.hidden=false}else l.hidden=true;
}
const KEYS=[...F,'date','exp','folio','color','tipo'];
function state(o){const s={};KEYS.forEach(k=>s[k]=val(k));return Object.assign(s,o||{})}
function qrUrl(st){
 const v=$('ver').value.trim();
 if(v){const u=/^https?:\/\//i.test(v)?v:'https://'+v;return u+(u.includes('?')?'&':'?')+'folio='+encodeURIComponent(st.folio)+'&nombre='+encodeURIComponent(st.name)}
 const base=location.href.split('#')[0];
 return base+'#c='+btoa(unescape(encodeURIComponent(JSON.stringify(st))));
}
function qrHtml(st){
 try{const q=qrcode(0,'L');q.addData(qrUrl(st));q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})+'<div>Escanea para verificar</div>'}
 catch(e){return ''}
}
const sig={1:'',2:''};let cur=0,drawing=false,dirty=false;
const pad=$('pad'),pc=pad.getContext('2d');
function padReset(){pc.clearRect(0,0,pad.width,pad.height);pc.lineWidth=4;pc.lineCap='round';pc.lineJoin='round';pc.strokeStyle='#111';dirty=false}
function pp(e){const r=pad.getBoundingClientRect();return[(e.clientX-r.left)*pad.width/r.width,(e.clientY-r.top)*pad.height/r.height]}
pad.addEventListener('pointerdown',e=>{drawing=true;dirty=true;pad.setPointerCapture(e.pointerId);const[x,y]=pp(e);pc.beginPath();pc.moveTo(x,y);pc.lineTo(x+.1,y);pc.stroke();e.preventDefault()});
pad.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=pp(e);pc.lineTo(x,y);pc.stroke()});
['pointerup','pointercancel'].forEach(t=>pad.addEventListener(t,()=>{drawing=false}));
function trim(){const d=pc.getImageData(0,0,pad.width,pad.height).data;let x0=pad.width,y0=pad.height,x1=0,y1=0;
 for(let y=0;y<pad.height;y++)for(let x=0;x<pad.width;x++)if(d[(y*pad.width+x)*4+3]>0){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
 if(x1<x0)return '';const m=6,w=x1-x0+2*m,h=y1-y0+2*m,c=document.createElement('canvas');c.width=w;c.height=h;
 c.getContext('2d').drawImage(pad,x0-m,y0-m,w,h,0,0,w,h);return c.toDataURL('image/png')}
document.querySelectorAll('[data-draw]').forEach(b=>b.onclick=()=>{cur=+b.dataset.draw;padReset();$('modal').classList.add('on')});
$('padclr').onclick=padReset;$('padx').onclick=()=>$('modal').classList.remove('on');
$('padok').onclick=()=>{if(dirty)sig[cur]=trim();$('modal').classList.remove('on');render()};
document.querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>{sig[b.dataset.clr]='';render()});
document.querySelectorAll('[data-up]').forEach(i=>i.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{sig[i.dataset.up]=r.result;render()};r.readAsDataURL(f)}));
const P=(l,t,sb,d,c1,c2,se)=>({l,ttl:t,sub:sb,desc:d,c1,c2,seal:se});
const PRE={
 gen:P('General','Certificado','de aprobación y competencia','Ha completado satisfactoriamente el curso de Gestión de Proyectos con una duración de 40 horas académicas.','Directora Académica','Representante Legal','AUTORIZADO'),
 dev:P('Desarrollador de software','Certificado de Desarrollador','de competencia en desarrollo de software','Ha completado satisfactoriamente la formación como Desarrollador de Software, aprobando las evaluaciones teóricas y los proyectos prácticos del programa.','Director Académico','Coordinador Técnico','CERTIFICADO'),
 prog:P('Programación','Certificado de Programación','en lógica y lenguajes de programación','Ha aprobado el programa de Programación, demostrando dominio de algoritmos, estructuras de datos y buenas prácticas de código.','Director del Programa','Instructor Principal','APROBADO'),
 med:P('Médico / Doctor','Certificado de Formación Médica','de capacitación profesional en Medicina','Ha completado satisfactoriamente el programa de formación en Medicina, cumpliendo con las horas académicas y las evaluaciones requeridas.','Decano de la Facultad','Director Médico','VERIFICADO'),
 arq:P('Arquitecto','Certificado de Arquitectura','de formación en diseño y construcción','Ha completado satisfactoriamente el programa de Arquitectura, demostrando competencia en diseño, planificación y representación de proyectos.','Director de Arquitectura','Coordinador Académico','CERTIFICADO'),
 ing:P('Ingeniero','Certificado de Ingeniería','de competencia técnica profesional','Ha completado satisfactoriamente el programa de Ingeniería, aprobando las asignaturas y el proyecto final de aplicación.','Decano de Ingeniería','Director Académico','APROBADO'),
 abg:P('Abogado','Certificado de Derecho','de formación jurídica profesional','Ha completado satisfactoriamente el programa de formación en Derecho, cumpliendo con las horas académicas y la evaluación final.','Decano de la Facultad','Secretario Académico','CERTIFICADO'),
 cont:P('Contador','Certificado de Contabilidad','de formación en contabilidad y finanzas','Ha completado satisfactoriamente el programa de Contabilidad y Finanzas, aprobando las evaluaciones del plan de estudios.','Director Académico','Coordinador de Finanzas','APROBADO'),
 enf:P('Enfermería','Certificado de Enfermería','de capacitación en cuidados de salud','Ha completado satisfactoriamente el programa de Enfermería, con sus prácticas clínicas y evaluaciones correspondientes.','Directora de Enfermería','Coordinadora Clínica','VERIFICADO'),
 doc:P('Docente','Certificado de Docencia','de formación pedagógica','Ha completado satisfactoriamente el programa de Formación Docente, aprobando los módulos de pedagogía y práctica en aula.','Director Académico','Coordinador Pedagógico','CERTIFICADO'),
 dis:P('Diseñador gráfico','Certificado de Diseño Gráfico','de competencia en diseño visual','Ha completado satisfactoriamente el programa de Diseño Gráfico, presentando un portafolio que cumple con los criterios de evaluación.','Director Creativo','Coordinador Académico','APROBADO')
};
function applyPreset(clear){const p=PRE[$('tipo').value]||PRE.gen;['ttl','sub','desc','c1','c2','seal'].forEach(k=>{$(k).placeholder=p[k];if(clear)$(k).value=''})}
$('tipo').innerHTML=Object.keys(PRE).map(k=>'<option value="'+k+'">'+PRE[k].l+'</option>').join('');
$('tipo').addEventListener('change',()=>{applyPreset(true);render()});
const SK='cert-form-v1';
function save(){try{const o={};[...KEYS,'ver'].forEach(k=>o[k]=$(k).value);localStorage.setItem(SK,JSON.stringify(o))}catch(e){}
try{localStorage.setItem('cert-sig-v1',JSON.stringify(sig))}catch(e){}}
function restore(){try{const g=JSON.parse(localStorage.getItem('cert-sig-v1')||'null');if(g){sig[1]=g[1]||'';sig[2]=g[2]||''}}catch(e){}
try{const o=JSON.parse(localStorage.getItem(SK)||'null');if(!o)return;Object.keys(o).forEach(k=>{if($(k)&&o[k]!==undefined&&o[k]!=='')$(k).value=o[k]})}catch(e){}}
function loadHash(){
 const m=location.hash.match(/^#c=(.+)$/);if(!m)return false;
 try{const st=JSON.parse(decodeURIComponent(escape(atob(m[1]))));KEYS.forEach(k=>{if(st[k]!==undefined)$(k).value=st[k]});return true}catch(e){return false}
}
function fit(){
 const w=$('fit').parentElement.clientWidth,k=Math.min(1,w/1000);
 $('fit').style.width=1000*k+'px';$('fit').style.height=707*k+'px';
 $('cert').style.transform='scale('+k+')';
}
window.addEventListener('resize',fit);window.addEventListener('orientationchange',fit);
function newFolio(){const y=new Date().getFullYear();$('folio').value='CERT-'+y+'-'+Math.random().toString(36).slice(2,8).toUpperCase()}
document.querySelectorAll('input,textarea').forEach(e=>{if(e.type!=='file')e.addEventListener('input',render)});
$('logo').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{logoData=r.result;render()};r.readAsDataURL(f)});
let folioManual=false;
$('folio').addEventListener('input',()=>{folioManual=true});
$('name').addEventListener('input',()=>{if(!folioManual){newFolio();render()}});
$('gen').onclick=()=>{folioManual=false;newFolio();render()};
$('print').onclick=()=>window.print();
$('csv').onclick=()=>{
 const t=prompt('Pega un nombre por línea:');if(!t)return;
 const names=t.split('\n').map(s=>s.trim()).filter(Boolean);if(!names.length)return;
 const base=$('cert');const w=window.open('','_blank');
 if(!w){alert('Permite ventanas emergentes para generar varios.');return}
 let html='<html><head><title>Certificados</title><style>@page{size:A4 landscape;margin:0}body{margin:0}.p{page-break-after:always;width:1000px;height:707px;transform-origin:top left}'+document.querySelector('style').textContent.replace(/@media print\{[\s\S]*$/,'')+'</style></head><body>';
 names.forEach((n,i)=>{const c=base.cloneNode(true);c.removeAttribute('id');c.style.transform='';c.querySelector('.name').textContent=n;
  const f=$('folio').value.replace(/(\d+|[A-Z0-9]{6})$/,'')+ (i+1).toString().padStart(3,'0');
  if($('folio').value)c.querySelector('.meta').textContent=c.querySelector('.meta').textContent.replace($('folio').value,f);
  c.querySelector('.qr').innerHTML=qrHtml(state({name:n,folio:$('folio').value?f:''}));
  html+='<div class="p" style="--c:'+$('color').value+'">'+c.outerHTML+'</div>'});
 w.document.write(html+'</body></html>');w.document.close();setTimeout(()=>w.print(),500);
};
$('date').value=new Date().toISOString().slice(0,10);newFolio();restore();loadHash();applyPreset(false);render();fit();
</script>
</body>
</html>
